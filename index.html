<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100dvh;
    font-family: 'Cinzel', serif;
    overflow: hidden;
    background: #060810;
  }

  /* === VIDEO BACKGROUND === */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .bg-video.playing {
    opacity: 1;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.38);
    pointer-events: none;
    z-index: 1;
  }

  /* === CLICK GATE === */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }

  /* blurred bg behind gate */
  .gate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(4, 6, 12, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .gate.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .gate-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* Pulsing circle button */
  .gate-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1.5px solid rgba(215, 205, 180, 0.5);
    background: rgba(10, 12, 20, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(215, 205, 180, 0.85);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(215,205,180,0.25); }
    50%       { box-shadow: 0 0 0 12px rgba(215,205,180,0); }
  }

  .gate-text {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    color: rgba(200, 192, 172, 0.55);
    text-transform: uppercase;
  }

  /* === MAIN CONTENT === */
  .center {
    position: fixed;
    top: 28%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    z-index: 2;
    /* blurred until click */
    filter: blur(6px);
    opacity: 0.4;
    transition: filter 0.8s ease, opacity 0.8s ease;
  }

  .center.revealed {
    filter: blur(0);
    opacity: 1;
  }

  .name {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: rgba(225, 218, 200, 0.9);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    border-right: 1px solid rgba(225,218,200,0.8);
    width: 0;
  }
  .name.typing {
    animation: typing 1.2s steps(5, end) 0.2s forwards, blink 0.75s step-end 1.4s 4;
  }

  @keyframes typing {
    from { width: 0; }
    to   { width: 3.2em; }
  }
  @keyframes blink {
    50% { border-color: transparent; }
  }

  .hud-icons {
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .hud-icons.show { opacity: 1; }

  .hud-icons img {
    width: 13px;
    height: 13px;
    object-fit: contain;
    filter: brightness(0) invert(1) opacity(0.75);
  }

  .level {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    color: rgba(200, 192, 172, 0.55);
    opacity: 0;
    transition: opacity 0.4s ease 0.1s;
  }
  .level.show { opacity: 1; }

  .vline {
    width: 1px;
    height: 12px;
    background: rgba(200, 192, 172, 0.3);
    opacity: 0;
    transition: opacity 0.4s ease 0.15s;
  }
  .vline.show { opacity: 1; }

  .location {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    color: rgba(200, 192, 172, 0.55);
    font-family: sans-serif;
    opacity: 0;
    transition: opacity 0.4s ease 0.2s;
  }
  .location.show { opacity: 1; }

  .socials {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.5s ease 0.3s;
  }
  .socials.show { opacity: 1; }

  .social-link {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(215, 205, 185, 0.82);
    text-decoration: none;
    border: 1px solid rgba(210, 200, 175, 0.2);
    background: rgba(8, 10, 18, 0.3);
    backdrop-filter: blur(4px);
    transition: color 150ms, border-color 150ms, transform 150ms;
  }
  .social-link:hover {
    color: rgba(240, 230, 210, 1);
    border-color: rgba(210, 200, 175, 0.5);
    transform: scale(1.12);
  }
  .social-link svg { width: 13px; height: 13px; }
  .social-link.notepad {
    border-radius: 5px;
    background: rgba(180, 200, 180, 0.15);
  }

  .views {
    position: fixed;
    bottom: 14px;
    left: 14px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(5, 7, 15, 0.55);
    border: 1px solid rgba(200,192,172,0.15);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.62rem;
    font-family: sans-serif;
    color: rgba(190,185,170,0.5);
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND — benenn dein Video "background.mp4" -->

  </nav>
</div>

<!-- AUDIO — benenn deine Audiodatei "sound.mp3" -->
<audio id="bgAudio" loop>
  <source src="sound.mp3" type="audio/mpeg">
</audio>

<div class="views">
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  62.188
</div>

<script>
function unlock() {
  const gate    = document.getElementById('gate');
  const content = document.getElementById('content');
  const video   = document.getElementById('bgVideo');
  const audio   = document.getElementById('bgAudio');
  const name    = document.getElementById('name');

  // 1. Video + Audio starten
  video.play().then(() => {
    video.classList.add('playing');
  }).catch(() => {
    // Video ohne Sound fallback
    video.muted = true;
    video.play();
    video.classList.add('playing');
  });

  audio.volume = 0.5;
  audio.play().catch(() => {});

  // 2. Gate ausblenden
  gate.classList.add('hidden');

  // 3. Content einblenden (Blur weg)
  content.classList.add('revealed');

  // 4. Typing + Fade-in starten
  setTimeout(() => {
    name.classList.add('typing');
  }, 400);

  setTimeout(() => {
    document.getElementById('hudIcons').classList.add('show');
    document.getElementById('level').classList.add('show');
    document.getElementById('vline').classList.add('show');
    document.getElementById('location').classList.add('show');
    document.getElementById('socials').classList.add('show');
  }, 1400);
}
</script>
</body>
</html>
